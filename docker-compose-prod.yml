version: '3.8'

# ============================================================
# IoT 平台 - 生产环境基础设施 (Kafka + EMQX + MySQL主从 + Redis)
# 使用: docker-compose -f docker-compose-prod.yml up -d
# ============================================================

services:
  # ==================== MySQL 主库（写） ====================
  mysql-master:
    image: mysql:8.0
    container_name: iot-mysql-master
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      MYSQL_DATABASE: iot_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-master-data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=1
      --log-bin=mysql-bin
      --binlog-format=ROW
      --gtid_mode=ON
      --enforce-gtid-consistency=ON
    networks:
      - iot-prod

  # ==================== MySQL 从库（读） ====================
  mysql-slave:
    image: mysql:8.0
    container_name: iot-mysql-slave
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root123456}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-slave-data:/var/lib/mysql
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --server-id=2
      --read-only=ON
    depends_on:
      - mysql-master
    networks:
      - iot-prod

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: iot-redis-prod
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123456} --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - iot-prod

  # ==================== EMQX MQTT Broker (集群) ====================
  emqx:
    image: emqx/emqx:5.7
    container_name: iot-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"       # MQTT
      - "8083:8083"       # MQTT over WebSocket
      - "8084:8084"       # MQTT over WSS
      - "8883:8883"       # MQTT over TLS
      - "18083:18083"     # Dashboard
    environment:
      EMQX_NAME: iot-emqx
      EMQX_HOST: emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: admin
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_PASSWORD:-emqx123456}
    volumes:
      - emqx-data:/opt/emqx/data
    networks:
      - iot-prod

  # ==================== Kafka ====================
  kafka:
    image: bitnami/kafka:3.7
    container_name: iot-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_NUM_PARTITIONS: 3
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - iot-prod

  # ==================== InfluxDB 2.0 ====================
  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb-prod
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-admin123456}
      DOCKER_INFLUXDB_INIT_ORG: iot
      DOCKER_INFLUXDB_INIT_BUCKET: device_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-iot-platform-token-very-long-secret-string}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - iot-prod

  # ==================== Prometheus 监控 ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: iot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - iot-prod

  # ==================== Grafana 可视化 ====================
  grafana:
    image: grafana/grafana:latest
    container_name: iot-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-grafana123}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - iot-prod

volumes:
  mysql-master-data:
  mysql-slave-data:
  redis-data:
  emqx-data:
  kafka-data:
  influxdb-data:
  prometheus-data:
  grafana-data:

networks:
  iot-prod:
    driver: bridge
