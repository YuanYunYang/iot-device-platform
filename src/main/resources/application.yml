# ============================================================
# IoT 设备接入管控平台 - 应用配置
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /iot

spring:
  application:
    name: iot-device-platform

  # ===================== Jackson 序列化 =====================
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  # ===================== MySQL 数据源 =====================
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/iot_platform?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456

  # ===================== Redis 缓存 =====================
  data:
    redis:
      host: localhost
      port: 6379
      password: redis123456
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2
          max-wait: 3000ms

# ===================== MyBatis-Plus 配置 =====================
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.iot.platform.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ===================== MQTT 配置 =====================
mqtt:
  # MQTT Broker 地址
  host: tcp://localhost:1883
  # 客户端 ID（平台作为 MQTT 客户端）
  client-id: iot-platform-server
  # 用户名 / 密码（Mosquitto 匿名模式下可留空）
  username: ""
  password: ""
  # 默认 QoS
  qos: 1
  # 心跳保活（秒）
  keep-alive-interval: 60
  # 连接超时（秒）
  connection-timeout: 30
  # 是否清除会话
  clean-session: false
  # 自动重连
  automatic-reconnect: true
  # 订阅的设备主题前缀，使用通配符订阅所有设备消息
  topic-prefix: iot/device/#

# ===================== InfluxDB 2.0 配置 =====================
influxdb:
  url: http://localhost:8086
  token: iot-platform-token-very-long-secret-string
  org: iot
  bucket: device_data

# ===================== 设备心跳检测配置 =====================
iot:
  heartbeat:
    # 心跳扫描间隔（毫秒），默认 60 秒
    scan-interval: 60000
    # 心跳超时阈值（秒），超过该时间未上报即视为离线，默认 90 秒
    timeout: 90
  control:
    # 远程控制同步等待响应超时时间（秒），默认 30 秒
    response-timeout: 30

# ===================== JWT 认证配置 =====================
jwt:
  # JWT 签名密钥（至少 32 字节）
  secret: iotPlatformJwtSecretKey2026VeryLongSecretString
  # Token 有效期（毫秒），默认 24 小时
  expiration: 86400000

# ===================== Knife4j 文档配置 =====================
knife4j:
  enable: true
  setting:
    language: zh_cn

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: com.iot.platform.controller

# ===================== 日志配置 =====================
logging:
  level:
    com.iot.platform: debug
    org.eclipse.paho: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
