# ============================================================
# IoT 平台 - 本地开发编排（轻量单机）
# 使用: docker compose -f docker-compose.dev.yml --env-file .env up -d
# 请先复制 .env.example 为 .env 并修改密钥
# ============================================================

services:
  mysql:
    image: mysql:8.0
    container_name: iot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      MYSQL_DATABASE: iot_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=128M
      --performance-schema=OFF
      --max-connections=50
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_PASSWORD:-change-me-db-password}"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      - iot-dev

  redis:
    image: redis:7-alpine
    container_name: iot-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-change-me-redis-password} --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me-redis-password}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - iot-dev

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./deploy/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    mem_limit: 64m
    networks:
      - iot-dev

  influxdb:
    image: influxdb:2.7
    container_name: iot-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD:-change-me-influx-password}
      DOCKER_INFLUXDB_INIT_ORG: iot
      DOCKER_INFLUXDB_INIT_BUCKET: device_data
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN:-change-me-influx-token}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    mem_limit: 256m
    networks:
      - iot-dev

  kafka:
    image: apache/kafka:3.7.0
    container_name: iot-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_HEAP_OPTS: "-Xms128m -Xmx256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    mem_limit: 400m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks:
      - iot-dev

  app:
    image: eclipse-temurin:17-jre-alpine
    container_name: iot-app
    restart: unless-stopped
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mosquitto:
        condition: service_started
      influxdb:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      TZ: Asia/Shanghai
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-db-password}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis-password}
      KAFKA_SERVERS: kafka:9092
      MQTT_HOST: tcp://mosquitto:1883
      INFLUX_HOST: influxdb
      INFLUX_TOKEN: ${INFLUX_TOKEN:-change-me-influx-token}
      JWT_SECRET: ${JWT_SECRET:-change-me-jwt-secret-at-least-32-chars}
    volumes:
      - ./deploy/app.jar:/app/app.jar:ro
    entrypoint: ["java"]
    command: ["-Xms256m","-Xmx384m","-XX:+UseSerialGC","-Djava.security.egd=file:/dev/./urandom","-jar","/app/app.jar"]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ':1F90' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
    networks:
      - iot-dev

  nginx:
    image: nginx:1.27-alpine
    container_name: iot-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html/frontend:ro
    mem_limit: 64m
    networks:
      - iot-dev

volumes:
  mysql-data:
  redis-data:
  mosquitto-data:
  influxdb-data:
  kafka-data:

networks:
  iot-dev:
    driver: bridge
