<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT 设备接入管控平台</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f1117; --card: #1a1d29; --border: #2a2d3a;
            --text: #e4e6eb; --text-dim: #8b8fa3; --primary: #4f8cf0;
            --success: #22c55e; --warning: #f59e0b; --danger: #ef4444;
            --info: #06b6d4; --radius: 12px;
        }
        body { font-family: -apple-system, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); }
        .layout { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 220px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); }
        .sidebar-header h1 { font-size: 16px; font-weight: 700; color: var(--primary); }
        .sidebar-header p { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
        .nav { flex: 1; padding: 12px 0; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 20px; cursor: pointer; color: var(--text-dim); font-size: 14px; transition: all .2s; border-left: 3px solid transparent; }
        .nav-item:hover { background: rgba(79,140,240,.08); color: var(--text); }
        .nav-item.active { background: rgba(79,140,240,.12); color: var(--primary); border-left-color: var(--primary); }
        .nav-icon { font-size: 18px; width: 24px; text-align: center; }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .topbar { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: var(--card); border-bottom: 1px solid var(--border); }
        .topbar-title { font-size: 16px; font-weight: 600; }
        .topbar-right { display: flex; align-items: center; gap: 16px; }
        .ws-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }
        .ws-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--danger); }
        .ws-dot.connected { background: var(--success); animation: pulse 2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .5; } }
        .token-input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-size: 12px; width: 200px; }
        .content { flex: 1; overflow-y: auto; padding: 24px; }

        /* Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
        .stat-card .label { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 700; }
        .stat-card .sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
        .stat-card.online .value { color: var(--success); }
        .stat-card.offline .value { color: var(--text-dim); }
        .stat-card.alarm .value { color: var(--danger); }
        .stat-card.total .value { color: var(--primary); }

        /* Panel */
        .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 24px; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--border); }
        .panel-title { font-size: 14px; font-weight: 600; }
        .panel-body { padding: 20px; }

        /* Grid */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }

        /* Table */
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 10px 12px; font-size: 12px; color: var(--text-dim); font-weight: 500; border-bottom: 1px solid var(--border); }
        td { padding: 10px 12px; font-size: 13px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(255,255,255,.02); }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
        .badge-online { background: rgba(34,197,94,.15); color: var(--success); }
        .badge-offline { background: rgba(139,143,163,.15); color: var(--text-dim); }
        .badge-critical { background: rgba(239,68,68,.15); color: var(--danger); }
        .badge-warning { background: rgba(245,158,11,.15); color: var(--warning); }
        .badge-info { background: rgba(6,182,212,.15); color: var(--info); }

        /* Chart */
        .chart-container { position: relative; height: 260px; }

        /* Alarm list */
        .alarm-item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); }
        .alarm-item:last-child { border-bottom: none; }
        .alarm-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
        .alarm-icon.critical { background: rgba(239,68,68,.15); }
        .alarm-icon.warning { background: rgba(245,158,11,.15); }
        .alarm-icon.info { background: rgba(6,182,212,.15); }
        .alarm-content { flex: 1; }
        .alarm-title { font-size: 13px; font-weight: 500; }
        .alarm-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

        /* OTA progress */
        .progress-bar { width: 100%; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
        .progress-text { font-size: 11px; color: var(--text-dim); margin-top: 4px; }

        /* Rule editor */
        .rule-editor { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Courier New', monospace; font-size: 12px; color: var(--text); min-height: 120px; width: 100%; resize: vertical; }
        .btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500; transition: all .2s; }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { opacity: .85; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .btn-danger { background: rgba(239,68,68,.2); color: var(--danger); }
        .btn-success { background: rgba(34,197,94,.2); color: var(--success); }

        /* Tabs */
        .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
        .tab { padding: 8px 16px; cursor: pointer; font-size: 13px; color: var(--text-dim); border-bottom: 2px solid transparent; }
        .tab.active { color: var(--primary); border-bottom-color: var(--primary); }

        .page { display: none; }
        .page.active { display: block; }

        .empty { text-align: center; padding: 40px; color: var(--text-dim); font-size: 13px; }

        /* Form */
        .form-group { margin-bottom: 12px; }
        .form-label { font-size: 12px; color: var(--text-dim); margin-bottom: 4px; display: block; }
        .form-input { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; width: 100%; }

        /* Responsive */
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .grid-2, .grid-3 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div class="layout">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h1>IoT 管控平台</h1>
            <p>SaaS Device Platform</p>
        </div>
        <div class="nav">
            <div class="nav-item active" onclick="showPage('dashboard', this)"><span class="nav-icon">&#9632;</span> 总览看板</div>
            <div class="nav-item" onclick="showPage('devices', this)"><span class="nav-icon">&#9641;</span> 设备管理</div>
            <div class="nav-item" onclick="showPage('alarms', this)"><span class="nav-icon">&#9888;</span> 告警中心</div>
            <div class="nav-item" onclick="showPage('ota', this)"><span class="nav-icon">&#8593;</span> OTA 升级</div>
            <div class="nav-item" onclick="showPage('rules', this)"><span class="nav-icon">&#9881;</span> 规则引擎</div>
        </div>
    </div>

    <!-- Main -->
    <div class="main">
        <div class="topbar">
            <div class="topbar-title" id="pageTitle">总览看板</div>
            <div class="topbar-right">
                <div class="ws-status">
                    <span class="ws-dot" id="wsDot"></span>
                    <span id="wsText">未连接</span>
                </div>
                <input class="token-input" id="tokenInput" placeholder="输入 JWT Token..." />
                <button class="btn btn-primary btn-sm" onclick="connectWs()">连接</button>
            </div>
        </div>
        <div class="content">
            <!-- Dashboard Page -->
            <div class="page active" id="page-dashboard">
                <div class="stats-grid">
                    <div class="stat-card total">
                        <div class="label">设备总数</div>
                        <div class="value" id="statTotal">0</div>
                        <div class="sub">所有注册设备</div>
                    </div>
                    <div class="stat-card online">
                        <div class="label">在线设备</div>
                        <div class="value" id="statOnline">0</div>
                        <div class="sub" id="statOnlineRate">在线率 0%</div>
                    </div>
                    <div class="stat-card offline">
                        <div class="label">离线设备</div>
                        <div class="value" id="statOffline">0</div>
                        <div class="sub">超过90秒无心跳</div>
                    </div>
                    <div class="stat-card alarm">
                        <div class="label">活跃告警</div>
                        <div class="value" id="statAlarm">0</div>
                        <div class="sub" id="statAlarmToday">今日 0 条</div>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">实时设备数据趋势</span></div>
                        <div class="panel-body">
                            <div class="chart-container"><canvas id="realtimeChart"></canvas></div>
                        </div>
                    </div>
                    <div class="panel">
                        <div class="panel-header"><span class="panel-title">设备状态分布</span></div>
                        <div class="panel-body">
                            <div class="chart-container"><canvas id="statusChart"></canvas></div>
                        </div>
                    </div>
                </div>
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">最近告警</span>
                        <button class="btn btn-sm btn-primary" onclick="showPage('alarms', document.querySelectorAll('.nav-item')[2])">查看全部</button>
                    </div>
                    <div class="panel-body" id="recentAlarms">
                        <div class="empty">暂无告警记录</div>
                    </div>
                </div>
            </div>

            <!-- Devices Page -->
            <div class="page" id="page-devices">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">设备列表</span>
                        <button class="btn btn-sm btn-primary" onclick="loadDevices()">刷新</button>
                    </div>
                    <div class="panel-body" style="padding:0">
                        <table>
                            <thead>
                                <tr><th>设备ID</th><th>设备名称</th><th>产品</th><th>状态</th><th>固件版本</th><th>最后上线</th><th>操作</th></tr>
                            </thead>
                            <tbody id="deviceTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Alarms Page -->
            <div class="page" id="page-alarms">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">告警列表</span>
                        <button class="btn btn-sm btn-primary" onclick="loadAlarms()">刷新</button>
                    </div>
                    <div class="panel-body" id="alarmList">
                        <div class="empty">暂无告警</div>
                    </div>
                </div>
            </div>

            <!-- OTA Page -->
            <div class="page" id="page-ota">
                <div class="tabs">
                    <div class="tab active" onclick="switchTab('ota-firmware', this)">固件管理</div>
                    <div class="tab" onclick="switchTab('ota-tasks', this)">升级任务</div>
                </div>
                <div id="ota-firmware">
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">固件包列表</span>
                            <button class="btn btn-sm btn-primary" onclick="loadFirmwares()">刷新</button>
                        </div>
                        <div class="panel-body" style="padding:0">
                            <table>
                                <thead><tr><th>版本</th><th>产品</th><th>大小</th><th>状态</th><th>创建时间</th></tr></thead>
                                <tbody id="firmwareTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
                <div id="ota-tasks" style="display:none">
                    <div class="panel">
                        <div class="panel-header">
                            <span class="panel-title">升级任务</span>
                            <button class="btn btn-sm btn-primary" onclick="loadOtaTasks()">刷新</button>
                        </div>
                        <div class="panel-body" style="padding:0">
                            <table>
                                <thead><tr><th>任务名称</th><th>目标</th><th>状态</th><th>进度</th><th>成功/失败</th><th>操作</th></tr></thead>
                                <tbody id="otaTaskTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Rules Page -->
            <div class="page" id="page-rules">
                <div class="panel">
                    <div class="panel-header">
                        <span class="panel-title">告警规则管理</span>
                        <div>
                            <button class="btn btn-sm btn-success" onclick="reloadRules()">重载规则</button>
                            <button class="btn btn-sm btn-primary" onclick="showRuleEditor()">新增规则</button>
                        </div>
                    </div>
                    <div class="panel-body" style="padding:0">
                        <table>
                            <thead><tr><th>规则名称</th><th>类型</th><th>状态</th><th>描述</th><th>操作</th></tr></thead>
                            <tbody id="ruleTableBody"></tbody>
                        </table>
                    </div>
                </div>
                <div class="panel" id="ruleEditorPanel" style="display:none">
                    <div class="panel-header"><span class="panel-title" id="ruleEditorTitle">新增规则</span></div>
                    <div class="panel-body">
                        <div class="grid-2">
                            <div class="form-group">
                                <label class="form-label">规则名称</label>
                                <input class="form-input" id="ruleName" placeholder="如：温度超阈值告警" />
                            </div>
                            <div class="form-group">
                                <label class="form-label">规则类型</label>
                                <select class="form-input" id="ruleType">
                                    <option value="THRESHOLD">阈值告警</option>
                                    <option value="COMPOSITE">复合告警</option>
                                    <option value="TIME_WINDOW">时间窗口</option>
                                </select>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">DRL 规则内容</label>
                            <textarea class="rule-editor" id="ruleDrl" placeholder="package com.iot.platform.rules;&#10;rule 'Temperature Critical'&#10;when&#10;    DevicePropertyFact(properties['temperature'] > 40)&#10;then&#10;    fact.addResult(new AlarmResult(...));&#10;end"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">描述</label>
                            <input class="form-input" id="ruleDesc" placeholder="规则描述" />
                        </div>
                        <button class="btn btn-primary" onclick="saveRule()">保存规则</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const API_BASE = '/iot';
let token = '';
let ws = null;
let realtimeChart = null;
let statusChart = null;
let realtimeData = { labels: [], datasets: {} };

// Page navigation
function showPage(name, el) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + name).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('pageTitle').textContent = el.textContent.trim();
    if (name === 'dashboard') loadDashboard();
    if (name === 'devices') loadDevices();
    if (name === 'alarms') loadAlarms();
    if (name === 'ota') { loadFirmwares(); loadOtaTasks(); }
    if (name === 'rules') loadRules();
}

function switchTab(tabId, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('ota-firmware').style.display = tabId === 'ota-firmware' ? '' : 'none';
    document.getElementById('ota-tasks').style.display = tabId === 'ota-tasks' ? '' : 'none';
}

// API helper
async function api(method, path, body) {
    const opts = { method, headers: { 'Content-Type': 'application/json' } };
    if (token) opts.headers['Authorization'] = 'Bearer ' + token;
    if (body) opts.body = JSON.stringify(body);
    const res = await fetch(API_BASE + path, opts);
    if (!res.ok) throw new Error(`API ${path} failed: ${res.status}`);
    return res.json();
}

// WebSocket
function connectWs() {
    token = document.getElementById('tokenInput').value.trim();
    if (!token) { alert('请输入 JWT Token'); return; }
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    ws = new WebSocket(`${proto}://${location.host}${API_BASE}/ws/device`);
    ws.onopen = () => {
        document.getElementById('wsDot').classList.add('connected');
        document.getElementById('wsText').textContent = '已连接';
        loadDashboard();
    };
    ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleWsMessage(msg);
    };
    ws.onclose = () => {
        document.getElementById('wsDot').classList.remove('connected');
        document.getElementById('wsText').textContent = '已断开';
    };
    ws.onerror = () => { document.getElementById('wsText').textContent = '连接错误'; };
}

function handleWsMessage(msg) {
    if (msg.type === 'property') {
        updateRealtimeChart(msg.deviceId, msg.data?.properties || {});
    } else if (msg.type === 'alarm') {
        loadDashboard();
    } else if (msg.type === 'status') {
        loadDashboard();
    }
}

// Dashboard
async function loadDashboard() {
    try {
        const [devices, alarms] = await Promise.all([
            api('GET', '/device/list?page=1&size=1000'),
            api('GET', '/alarm/recent?limit=10')
        ]);
        const deviceList = devices.data?.records || devices.data || [];
        const alarmList = alarms.data || [];
        const total = deviceList.length;
        const online = deviceList.filter(d => d.status === 'ONLINE').length;
        const offline = total - online;
        const activeAlarms = alarmList.filter(a => a.status === 'ACTIVE').length;

        document.getElementById('statTotal').textContent = total;
        document.getElementById('statOnline').textContent = online;
        document.getElementById('statOffline').textContent = offline;
        document.getElementById('statAlarm').textContent = activeAlarms;
        document.getElementById('statOnlineRate').textContent = `在线率 ${total > 0 ? Math.round(online/total*100) : 0}%`;

        renderRecentAlarms(alarmList.slice(0, 5));
        renderStatusChart(online, offline);
        initRealtimeChart();
    } catch (e) { console.error('Dashboard load error:', e); }
}

function renderRecentAlarms(alarms) {
    const container = document.getElementById('recentAlarms');
    if (!alarms || alarms.length === 0) { container.innerHTML = '<div class="empty">暂无告警记录</div>'; return; }
    container.innerHTML = alarms.map(a => {
        const levelClass = a.alarmLevel?.toLowerCase() || 'info';
        const icon = levelClass === 'critical' ? '\u26A0' : levelClass === 'warning' ? '\u26A0' : '\u2139';
        return `<div class="alarm-item">
            <div class="alarm-icon ${levelClass}">${icon}</div>
            <div class="alarm-content">
                <div class="alarm-title">${a.alarmTitle || '告警'}</div>
                <div class="alarm-meta">设备: ${a.deviceId} | ${a.alarmTime || ''}</div>
            </div>
            <span class="badge badge-${levelClass}">${a.alarmLevel || 'INFO'}</span>
        </div>`;
    }).join('');
}

function initRealtimeChart() {
    if (realtimeChart) return;
    const ctx = document.getElementById('realtimeChart').getContext('2d');
    realtimeChart = new Chart(ctx, {
        type: 'line',
        data: { labels: [], datasets: [] },
        options: {
            responsive: true, maintainAspectRatio: false,
            plugins: { legend: { labels: { color: '#8b8fa3', font: { size: 11 } } } },
            scales: {
                x: { ticks: { color: '#8b8fa3', font: { size: 10 } }, grid: { color: '#2a2d3a' } },
                y: { ticks: { color: '#8b8fa3', font: { size: 10 } }, grid: { color: '#2a2d3a' } }
            }
        }
    });
}

function updateRealtimeChart(deviceId, properties) {
    if (!realtimeChart) initRealtimeChart();
    const now = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    realtimeChart.data.labels.push(now);
    if (realtimeChart.data.labels.length > 20) realtimeChart.data.labels.shift();

    Object.entries(properties).forEach(([key, val]) => {
        if (typeof val !== 'number') return;
        let ds = realtimeChart.data.datasets.find(d => d.label === key);
        if (!ds) {
            const colors = ['#4f8cf0', '#22c55e', '#f59e0b', '#06b6d4', '#ef4444'];
            ds = { label: key, data: [], borderColor: colors[realtimeChart.data.datasets.length % colors.length], borderWidth: 2, tension: 0.3, pointRadius: 1 };
            realtimeChart.data.datasets.push(ds);
        }
        ds.data.push(val);
        if (ds.data.length > 20) ds.data.shift();
    });
    realtimeChart.update('none');
}

function renderStatusChart(online, offline) {
    if (statusChart) statusChart.destroy();
    const ctx = document.getElementById('statusChart').getContext('2d');
    statusChart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['在线', '离线'],
            datasets: [{ data: [online, offline], backgroundColor: ['#22c55e', '#3a3d4a'], borderWidth: 0 }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { color: '#8b8fa3' } } } }
    });
}

// Devices
async function loadDevices() {
    try {
        const res = await api('GET', '/device/list?page=1&size=100');
        const list = res.data?.records || res.data || [];
        const tbody = document.getElementById('deviceTableBody');
        if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;color:var(--text-dim)">暂无设备</td></tr>'; return; }
        tbody.innerHTML = list.map(d => `<tr>
            <td>${d.deviceId}</td>
            <td>${d.deviceName || '-'}</td>
            <td>${d.productKey || '-'}</td>
            <td><span class="badge ${d.status === 'ONLINE' ? 'badge-online' : 'badge-offline'}">${d.status}</span></td>
            <td>${d.firmwareVersion || '-'}</td>
            <td>${d.lastOnlineTime || '-'}</td>
            <td><button class="btn btn-sm btn-primary" onclick="controlDevice('${d.deviceId}')">控制</button></td>
        </tr>`).join('');
    } catch (e) { console.error(e); }
}

function controlDevice(deviceId) {
    const cmd = prompt(`控制设备 ${deviceId}，输入命令 (如 switch):`);
    if (!cmd) return;
    const params = prompt('输入参数 JSON (如 {"state":true}):');
    try {
        api('POST', '/device/control', { deviceId, command: cmd, params: params ? JSON.parse(params) : {} })
            .then(r => alert('指令已发送: ' + JSON.stringify(r.data)))
            .catch(e => alert('发送失败: ' + e.message));
    } catch (e) { alert('参数格式错误'); }
}

// Alarms
async function loadAlarms() {
    try {
        const res = await api('GET', '/alarm/recent?limit=50');
        const list = res.data || [];
        const container = document.getElementById('alarmList');
        if (list.length === 0) { container.innerHTML = '<div class="empty">暂无告警</div>'; return; }
        container.innerHTML = list.map(a => {
            const lc = (a.alarmLevel || 'INFO').toLowerCase();
            const icon = lc === 'critical' ? '\u26A0' : lc === 'warning' ? '\u26A0' : '\u2139';
            return `<div class="alarm-item">
                <div class="alarm-icon ${lc}">${icon}</div>
                <div class="alarm-content">
                    <div class="alarm-title">${a.alarmTitle || '告警'}</div>
                    <div class="alarm-meta">设备: ${a.deviceId} | 属性: ${a.propertyIdentifier || '-'} | 值: ${a.alarmValue ?? '-'} | ${a.alarmTime || ''}</div>
                </div>
                <span class="badge badge-${lc}">${a.alarmLevel || 'INFO'}</span>
            </div>`;
        }).join('');
    } catch (e) { console.error(e); }
}

// OTA
async function loadFirmwares() {
    try {
        const res = await api('GET', '/ota/firmware/list');
        const list = res.data || [];
        const tbody = document.getElementById('firmwareTableBody');
        if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">暂无固件</td></tr>'; return; }
        tbody.innerHTML = list.map(f => `<tr>
            <td>v${f.version}</td>
            <td>${f.productId || '通用'}</td>
            <td>${(f.fileSize / 1024 / 1024).toFixed(2)} MB</td>
            <td><span class="badge badge-${f.status === 'PUBLISHED' ? 'online' : 'offline'}">${f.status}</span></td>
            <td>${f.createTime || '-'}</td>
        </tr>`).join('');
    } catch (e) { console.error(e); }
}

async function loadOtaTasks() {
    try {
        const res = await api('GET', '/ota/task/list');
        const list = res.data || [];
        const tbody = document.getElementById('otaTaskTableBody');
        if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-dim)">暂无升级任务</td></tr>'; return; }
        tbody.innerHTML = list.map(t => {
            const progress = t.totalCount > 0 ? Math.round((t.successCount + t.failCount) / t.totalCount * 100) : 0;
            return `<tr>
                <td>${t.taskName}</td>
                <td>${t.targetType || 'ALL'}</td>
                <td><span class="badge badge-${t.status === 'COMPLETED' ? 'online' : t.status === 'RUNNING' ? 'info' : 'offline'}">${t.status}</span></td>
                <td>
                    <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
                    <div class="progress-text">${progress}% (${t.successCount + t.failCount}/${t.totalCount})</div>
                </td>
                <td><span style="color:var(--success)">${t.successCount}</span> / <span style="color:var(--danger)">${t.failCount}</span></td>
                <td>${t.status === 'RUNNING' ? `<button class="btn btn-sm btn-danger" onclick="cancelOtaTask(${t.id})">取消</button>` : '-'}</td>
            </tr>`;
        }).join('');
    } catch (e) { console.error(e); }
}

async function cancelOtaTask(taskId) {
    try { await api('POST', `/ota/task/${taskId}/cancel`); loadOtaTasks(); } catch (e) { alert('取消失败: ' + e.message); }
}

// Rules
async function loadRules() {
    try {
        const res = await api('GET', '/rule/list');
        const list = res.data || [];
        const tbody = document.getElementById('ruleTableBody');
        if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;color:var(--text-dim)">暂无规则</td></tr>'; return; }
        tbody.innerHTML = list.map(r => `<tr>
            <td>${r.ruleName}</td>
            <td>${r.ruleType}</td>
            <td><span class="badge badge-${r.enabled ? 'online' : 'offline'}">${r.enabled ? '启用' : '禁用'}</span></td>
            <td>${r.description || '-'}</td>
            <td>
                <button class="btn btn-sm ${r.enabled ? 'btn-danger' : 'btn-success'}" onclick="toggleRule(${r.id}, ${!r.enabled})">${r.enabled ? '禁用' : '启用'}</button>
                <button class="btn btn-sm btn-danger" onclick="deleteRule(${r.id})">删除</button>
            </td>
        </tr>`).join('');
    } catch (e) { console.error(e); }
}

async function toggleRule(id, enable) {
    try {
        await api('POST', `/rule/${id}/${enable ? 'enable' : 'disable'}`);
        loadRules();
    } catch (e) { alert('操作失败: ' + e.message); }
}

async function deleteRule(id) {
    if (!confirm('确认删除该规则?')) return;
    try { await api('DELETE', `/rule/${id}`); loadRules(); } catch (e) { alert('删除失败: ' + e.message); }
}

async function reloadRules() {
    try { await api('POST', '/rule/reload'); alert('规则已重新加载'); } catch (e) { alert('重载失败: ' + e.message); }
}

function showRuleEditor() {
    document.getElementById('ruleEditorPanel').style.display = '';
    document.getElementById('ruleEditorTitle').textContent = '新增规则';
    document.getElementById('ruleName').value = '';
    document.getElementById('ruleType').value = 'THRESHOLD';
    document.getElementById('ruleDrl').value = '';
    document.getElementById('ruleDesc').value = '';
}

async function saveRule() {
    const body = {
        ruleName: document.getElementById('ruleName').value,
        ruleType: document.getElementById('ruleType').value,
        drlContent: document.getElementById('ruleDrl').value,
        description: document.getElementById('ruleDesc').value,
        enabled: 1
    };
    if (!body.ruleName || !body.drlContent) { alert('请填写规则名称和 DRL 内容'); return; }
    try {
        await api('POST', '/rule', body);
        alert('规则已保存');
        loadRules();
        document.getElementById('ruleEditorPanel').style.display = 'none';
    } catch (e) { alert('保存失败: ' + e.message); }
}

// Auto-init
window.addEventListener('load', () => {
    initRealtimeChart();
    // Auto-connect if token saved
    const savedToken = localStorage.getItem('iot_token');
    if (savedToken) {
        document.getElementById('tokenInput').value = savedToken;
    }
});

// Save token on connect
const origConnect = connectWs;
connectWs = function() {
    origConnect();
    localStorage.setItem('iot_token', document.getElementById('tokenInput').value);
};
</script>
</body>
